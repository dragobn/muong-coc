# Cấu hình Sveltia/Decap CMS — Du lịch cộng đồng Mường Cốc
# Khi setup: chỉ cần đổi base_url (Cloudflare Worker sveltia-cms-auth). Org đã điền.
backend:
  name: github
  repo: dulich-congdong-muongcoc/website          # vd: muong-coc/website
  branch: main
  base_url: https://<worker-auth-url>   # URL Cloudflare Worker xác thực GitHub

# Cho phép biên tập viên xem trước bản nháp
publish_mode: simple
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

# Hiển thị tiếng Việt
locale: vi

collections:
  # 1) TIN TỨC / SỰ KIỆN — xã tự đăng bài mới
  - name: tin-tuc
    label: Tin tức / Sự kiện
    label_singular: Bài viết
    description: Đăng tin hoạt động, sự kiện, thông báo của điểm đến.
    folder: content/tin-tuc
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - {name: title, label: Tiêu đề, widget: string}
      - {name: date, label: Ngày đăng, widget: datetime, format: "YYYY-MM-DD"}
      - {name: image, label: Ảnh đại diện, widget: image, required: false}
      - {name: summary, label: Tóm tắt (1-2 câu), widget: text, required: false}
      - {name: body, label: Nội dung, widget: markdown}

  # 2) ĐIỂM ĐẾN (POI) — sửa mô tả hồ sơ điểm đến
  - name: poi
    label: Điểm đến
    description: Sửa nội dung hồ sơ điểm đến. Không tự thêm/xoá điểm nếu không chắc.
    folder: content/ho-so-diem-den
    extension: md
    format: yaml-frontmatter
    create: false
    identifier_field: title
    fields:
      - {name: title, label: Tên điểm đến, widget: string, required: false}
      - {name: body, label: Nội dung hồ sơ, widget: markdown}

  # 3) TOUR — (STAGED) sẽ bật sau khi dời 22 file tour vào data/tours/
  #    và đồng bộ nội dung GĐ20 xong. Giữ comment để pass sau hoàn thiện.
  # - name: tour
  #   label: Tour / Cung
  #   folder: data/tours
  #   extension: json
  #   create: false
  #   fields:
  #     - {name: ten, label: Tên tour, widget: string}
  #     - {name: tagline, label: Tagline, widget: string, required: false}
  #     - {name: gia, label: Giá, widget: string}
  #     - {name: thoi_luong, label: Thời lượng, widget: string, required: false}
  #     - {name: intro, label: Giới thiệu, widget: text}
