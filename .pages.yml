# Cấu hình Pages CMS (pagescms.org) — biên tập nội dung web Mường Cốc.
# Xã đăng nhập app.pagescms.org bằng GitHub -> chọn repo -> sửa qua form.
# Lưu xong -> GitHub commit -> Cloudflare tự build lại web (~1-2 phút).
# Tour: Giá/Tên/Giới thiệu nằm đầu form (sửa nhanh); lịch trình chi tiết bên dưới.
# Schema tour = union mọi trường 19 tour -> lưu KHÔNG mất dữ liệu.

media:
  input: assets/img/uploads
  output: /assets/img/uploads
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  - svg
content:
- name: tin-tuc
  label: Tin tức / Sự kiện
  type: collection
  path: content/tin-tuc
  filename: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - title
    - date
  fields:
  - name: title
    label: Tiêu đề
    type: string
  - name: date
    label: Ngày đăng
    type: date
  - name: image
    label: Ảnh đại diện
    type: image
    required: false
  - name: summary
    label: Tóm tắt
    type: text
    required: false
  - name: body
    label: Nội dung
    type: rich-text
- name: tour
  label: Tour / Cung (giá & chi tiết)
  type: collection
  path: data/tours
  extension: json
  format: json
  view:
    fields:
    - ten
    - gia
  fields:
  - name: gia
    label: Giá
    type: string
  - name: gia_en
    label: Giá (EN)
    type: string
  - name: gia_fr
