<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=6.0, user-scalable=yes">
<title>Bản đồ du lịch Mường Cốc</title>
<meta name="description" content="Bản đồ du lịch cộng đồng Mường Cốc — điểm đến, cung tour, cung đạp xe.">
<meta property="og:image" content="/assets/ban-do-muong-coc.jpg">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#12140f}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;height:50px;padding:0 12px;background:rgba(18,20,15,.95);color:#fff;backdrop-filter:blur(6px)}
.bar a.back{color:#fff;text-decoration:none;font-size:1.5rem;line-height:1;padding:2px 6px}
.bar .tt{flex:1;font-size:.98rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a.dl{color:#EBCB86;text-decoration:none;font-size:.8rem;font-weight:600;white-space:nowrap}
.hint{background:#0A6A2F;color:#fff;text-align:center;font-size:.82rem;padding:7px 12px}
.mapwrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#12140f}
.mapwrap img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="/kit/" aria-label="Quay lại">←</a>
  <div class="tt">Bản đồ du lịch Mường Cốc</div>
  <a class="dl" href="/assets/ban-do-muong-coc.jpg" target="_blank" rel="noopener">Mở ảnh gốc ↗</a>
</div>
<div class="hint">Chụm 2 ngón để phóng to · kéo để di chuyển</div>
<div class="mapwrap"><img src="/assets/ban-do-muong-coc.jpg" alt="Bản đồ du lịch cộng đồng Mường Cốc"></div>
</body>
</html>
