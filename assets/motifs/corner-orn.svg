<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#0A6A2F" role="img" aria-label="Hoạ tiết góc khung">
<!-- CORNER ORNAMENT — góc khung (mặc định góc TRÊN-TRÁI). Xoay bằng CSS cho 4 góc. Trám + cuộn + chồi. 1 màu currentColor. -->
<g stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" fill="none">
<!-- 2 cạnh chữ L -->
<path d="M4 30 L4 4 L30 4"/>
<path d="M9 24 L9 9 L24 9" stroke-width=".7"/>
<!-- trám ở khuỷu -->
<path d="M9 9 L13 5 L17 9 L13 13 Z" stroke-width=".8"/>
<!-- cuộn cong đầu cạnh -->
<path d="M30 4 q10 0 12 8 q1 5 -4 6 q-4 0 -3 -4 q1 -2 3 -1" stroke-width=".9"/>
<path d="M4 30 q0 10 8 12 q5 1 6 -4 q0 -4 -4 -3 q-2 1 -1 3" stroke-width=".9"/>
<!-- chồi nhỏ điểm xuyết -->
<path d="M22 22 q3 -3 7 -3 q-1 4 -4 5 q-2 -1 -3 -2 Z" stroke-width=".7"/>
</g>
</svg>
