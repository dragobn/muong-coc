<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64" fill="none" stroke="#0A6A2F" role="img" aria-label="Nhà sàn Mường">
<!-- NHÀ SÀN — silhouette line nhà sàn mái cong, sàn cao trên cọc. Icon/watermark. 1 màu currentColor. -->
<g stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
<!-- mái cong (kiểu nóc rùa Mường) -->
<path d="M8 26 Q14 9 48 7 Q82 9 88 26"/>
<!-- bờ nóc + đôi sừng -->
<path d="M48 7 L45 2 M48 7 L51 2"/>
<!-- diềm mái -->
<path d="M8 26 L88 26"/>
<path d="M14 26 L82 26" stroke-width=".7"/>
<!-- thân sàn -->
<path d="M18 26 L18 44 L78 44 L78 26"/>
<!-- vách phên (đường dọc thưa) -->
<g stroke-width=".7">
<line x1="30" y1="29" x2="30" y2="44"/>
<line x1="42" y1="29" x2="42" y2="44"/>
<line x1="54" y1="29" x2="54" y2="44"/>
<line x1="66" y1="29" x2="66" y2="44"/>
</g>
<!-- cọc sàn -->
<line x1="22" y1="44" x2="22" y2="60"/>
<line x1="36" y1="44" x2="36" y2="60"/>
<line x1="48" y1="44" x2="48" y2="60"/>
<line x1="60" y1="44" x2="60" y2="60"/>
<line x1="74" y1="44" x2="74" y2="60"/>
<!-- nền đất -->
<line x1="12" y1="60" x2="84" y2="60"/>
<!-- cầu thang -->
<path d="M78 44 L90 60 M81 46 L84 50 M84 49 L87 53 M87 52 L90 56" stroke-width=".7"/>
</g>
</svg>
